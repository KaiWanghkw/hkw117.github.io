<style>
  :root {
    --bg-top: #EDEAE3;
    --bg-bottom: #CBC5B8;
    --ink: #211F1B;
    --ink-soft: #58544C;
    --card-bg: #FBFAF7;
    --card-border: rgba(33, 31, 27, 0.08);
    --accent: #A6743F;
    --accent-soft: #EFE3D3;
    --shadow-rest: 0 1px 2px rgba(33, 31, 27, 0.06), 0 6px 18px rgba(33, 31, 27, 0.07);
    --shadow-hover: 0 2px 4px rgba(33, 31, 27, 0.08), 0 12px 28px rgba(33, 31, 27, 0.12);
    --radius-full: 999px;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family: var(--font-body);
    color: var(--ink);
  }

  .page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .card {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: rise-in 0.5s ease-out both;
  }

  @keyframes rise-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar-ring {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    padding: 5px;
    margin-bottom: 20px;
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.4rem;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.7rem;
    line-height: 1.2;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .tagline {
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin: 0 0 32px;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    border-radius: var(--radius-full);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-rest);
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    font-size: 1rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .link-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
  }

  .link-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .link-btn .icon {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    color: var(--accent);
  }

  .link-btn .icon svg {
    width: 100%;
    height: 100%;
  }

  .link-btn .label {
    flex: 1;
    text-align: left;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  footer {
    margin-top: 44px;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .link-btn { transition: none; }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="card">

      <h1 class="name">Hsuan-Kai Wang</h1>
      <p class="tagline">商業攝影師 · Commercial Photography</p>

      <nav class="links" aria-label="社群與作品連結">
        <a class="link-btn" href="https://www.instagram.com/hkw11.7/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
              <circle cx="12" cy="13" r="3.4"/>

        <a class="link-btn" href="https://www.threads.com/@hkw11.7" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.2c-3.4 0-5.6 2.4-5.6 5.6 0 2.7 1.8 4.1 3.7 5.4 2 1.3 3.9 2.6 3.9 4.9 0 2.1-1.8 3.3-3.9 3.3-2.3 0-4-1.3-4.4-3.2"/>
            </svg>
          </span>
          <span class="label">Threads</span>

        <a class="link-btn" href="https://hsuankaiwang.myportfolio.com/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18M12 3c2.5 2.5 4 5.7 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.7-4-9s1.5-6.5 4-9z"/>
            </svg>
          </span>
          <span class="label">作品網站 Portfolio</span>
          <span class="sr-only">(在新視窗開啟)</span>
        </a>
      </nav>
    </div>

    <footer>
      <p>&copy; 2026 Hsuan-Kai Wang</p>
    </footer>
  </main>
</body>
</html>
